<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Laboratory Asset System</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <h1>Laboratory Asset System</h1>

            <p class="subtitle">
                Role-Based Asset Transaction and Approval Management
            </p>

            <form id="loginForm">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn-primary">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <hr>

            <p>Don't have an account?</p>

            <button
                class="btn-secondary"
                onclick="showSignup()">
                Create Requester Account
            </button>

        </div>


        <div class="login-card signup-card" id="signupBox">

            <h2>Create Account</h2>

            <form id="signupForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    required
                >

                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    minlength="6"
                    required
                >

                <button type="submit" class="btn-primary">
                    Register
                </button>

            </form>

            <p id="signupMessage"></p>

        </div>

    </div>


    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
